<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Internship radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--paper:#FFFFFF;--ink:#101316;--muted:#5F6670;--faint:#9AA1A9;--rule:#E6E8EB;--accent:#1B49D6;--accent-soft:#EEF2FD;--amber:#8A5A00;--amber-soft:#FFF4DC;--green:#1E7A4E;--green-soft:#E6F4EC}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
  a{color:inherit}
  .wrap{max-width:1080px;margin:0 auto;padding:0 28px}
  header{padding:56px 0 28px;border-bottom:1px solid var(--ink)}
  h1{font:600 64px/1 Fraunces,Georgia,serif;letter-spacing:-.02em;margin:0 0 18px;font-variation-settings:"opsz" 144}
  .lede{display:flex;gap:28px;flex-wrap:wrap;color:var(--muted);margin:0}
  .lede b{display:block;font:500 28px/1.1 Fraunces,Georgia,serif;color:var(--ink)}
  .toolbar{display:flex;flex-wrap:wrap;gap:14px 32px;align-items:flex-start;padding:18px 28px;border-bottom:1px solid var(--rule)}
  .search{flex:1 1 100%;max-width:520px}
  .search input{width:100%;border:0;border-bottom:1px solid var(--ink);padding:8px 0;font-size:17px;background:transparent;color:var(--ink);border-radius:0}
  .search input:focus{outline:none;border-bottom-color:var(--accent)}
  .controls{display:contents}
  .f{display:flex;flex-direction:column;gap:2px}
  .f-name{font-size:12px;color:var(--faint)}
  .f-opts{display:flex;gap:2px 14px;flex-wrap:wrap}
  .f-opts button{border:0;background:none;padding:2px 0;color:var(--muted);cursor:pointer;font:inherit;font-size:14px;border-bottom:2px solid transparent}
  .f-opts button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:500}
  .f-opts button:hover{color:var(--ink)}
  .meta{display:flex;justify-content:space-between;align-items:baseline;padding:16px 0 0;color:var(--muted);font-size:14px}
  .meta button{border:0;background:none;color:var(--accent);cursor:pointer;font:inherit;padding:0}
  .day{display:flex;align-items:baseline;gap:14px;margin:40px 0 14px}
  .day h2{font:500 30px/1 Fraunces,Georgia,serif;margin:0}
  .day span{color:var(--faint);font-size:14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule)}
  .card{background:var(--paper);padding:20px 20px 18px;display:flex;flex-direction:column;gap:8px;min-height:170px;position:relative}
  .card .co{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:10px}
  .card .co .t{color:var(--faint)}
  .card .co .t.fresh{color:var(--accent);font-weight:500}
  .card h3{margin:0;font:500 21px/1.25 Fraunces,Georgia,serif;letter-spacing:-.005em}
  .card h3 a{text-decoration:none}
  .card h3 a:hover{color:var(--accent)}
  .card .loc{color:var(--muted);font-size:14px}
  .card .tags{margin-top:auto;display:flex;flex-wrap:wrap;gap:6px;padding-top:8px}
  .tag{font-size:12px;padding:3px 8px;border-radius:4px;background:#F3F4F6;color:var(--muted)}
  .tag.req{background:var(--amber-soft);color:var(--amber)}
  .tag.spon{background:var(--green-soft);color:var(--green)}
  .tag.deg{background:var(--accent-soft);color:var(--accent)}
  .tag.score{background:var(--ink);color:#fff}
  .tag.src{margin-left:auto;background:transparent;border:1px solid var(--rule)}
  .empty{padding:60px 0;text-align:center;color:var(--muted)}
  .empty button{margin-top:10px;border:1px solid var(--ink);background:none;padding:7px 14px;cursor:pointer;font:inherit}
  footer{padding:50px 0 60px;color:var(--faint);font-size:13px;max-width:70ch}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media (max-width:640px){h1{font-size:44px}.lede b{font-size:22px}.card{min-height:0}}
</style>
</head>
<body>
<header class="wrap">
  <h1>Internship radar</h1>
  <p class="lede"><span><b id="n-today">–</b>posted today</span><span><b id="n-hour">–</b>in the last hour</span><span><b id="n-all">–</b>open postings</span></p>
</header>
<section class="wrap toolbar">
  <label class="search"><input id="q" type="search" placeholder="Search roles, companies, cities" aria-label="Search"></label>
  <div class="controls" id="controls"></div>
</section>
<main class="wrap">
  <div class="meta"><span id="count"></span><button id="clear" hidden>Clear filters</button></div>
  <div id="list"></div>
</main>
<footer class="wrap"><p id="updated"></p><p>Degree and work-authorization labels are read from each posting with keyword rules; confirm in the posting itself. Match % is Jobright's score for one profile.</p></footer>
<script src="core.js"></script>
<script>
(() => {
  const B = window.Board, $ = s => document.querySelector(s);
  let jobs = [], gen = null;
  const ctl = $("#controls"), q = $("#q"), list = $("#list"), count = $("#count"), clear = $("#clear");
  B.readURL(); B.mountControls(ctl, "chips", render, ["posted","degree","auth","model","source"]);
  q.value = B.state.q; q.addEventListener("input", () => { B.state.q = q.value; render(); });
  clear.addEventListener("click", () => { B.clear(); q.value = ""; render(); });
  function render(){
    B.syncControls(ctl); B.writeURL(); clear.hidden = B.isDefault();
    const now = new Date(), shown = B.sort(jobs.filter(j => B.matches(j, now)));
    count.textContent = `${shown.length} of ${jobs.length} postings`;
    if (!shown.length) { list.innerHTML = `<div class="empty">Nothing matches these filters.<br><button id="c2">Clear filters</button></div>`; $("#c2").onclick = () => clear.click(); return; }
    let html = "";
    for (const [k, items] of B.group(shown)) {
      html += `<div class="day"><h2>${B.esc(B.dayLabel(k, now))}</h2><span>${items.length}</span></div><div class="grid">`;
      for (const j of items) {
        const d = new Date(j.posted_at), fresh = now - d < 3600000;
        html += `<article class="card">
          <div class="co"><span>${B.esc(j.company)}</span><span class="t${fresh ? " fresh" : ""}">${B.esc(B.rel(d, now))}</span></div>
          <h3><a href="${B.esc(j.url)}" target="_blank" rel="noopener">${B.esc(j.title)}</a></h3>
          <div class="loc">${B.esc(j.location)}</div>
          <div class="tags">
            ${j.degrees.length ? `<span class="tag deg">${B.esc(j.degree)}</span>` : ""}
            ${j.work_auth === "Authorization required" ? `<span class="tag req">Authorization required</span>` : j.work_auth === "Sponsorship available" ? `<span class="tag spon">Sponsorship available</span>` : ""}
            ${j.work_model !== "Not specified" ? `<span class="tag">${B.esc(j.work_model)}</span>` : ""}
            ${j.score ? `<span class="tag score">${j.score}% match</span>` : ""}
            <span class="tag src">${B.esc(j.source)}</span>
          </div></article>`;
      }
      html += `</div>`;
    }
    list.innerHTML = html;
  }
  B.load().then(d => {
    jobs = d.jobs || []; const now = new Date();
    $("#n-all").textContent = jobs.length;
    $("#n-today").textContent = jobs.filter(j => B.dayKey(new Date(j.posted_at)) === B.dayKey(now)).length;
    $("#n-hour").textContent = jobs.filter(j => now - new Date(j.posted_at) < 3600000).length;
    if (d.generated_at) $("#updated").textContent = `Last checked ${B.rel(new Date(d.generated_at), now)}.`;
    render();
  }).catch(() => { list.innerHTML = `<div class="empty">The job list could not be loaded. Try again in a minute.</div>`; });
})();
</script>
</body>
</html>
