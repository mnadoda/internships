<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Internship radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#F4F5F9;--surface:#fff;--ink:#141A2B;--muted:#5D667A;--faint:#9AA3B5;--line:#E4E7EF;--accent:#3B4FE4;--accent-soft:#E9ECFC;
        --amber:#9A5B00;--amber-soft:#FFF1D6;--green:#0F7B4F;--green-soft:#DDF4E8;--violet:#6C3BD1;--violet-soft:#EFE8FC;--sky:#0B6E9E;--sky-soft:#E1F1FA}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 Manrope,system-ui,sans-serif}
  a{color:inherit}
  .layout{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
  aside{background:var(--surface);border-right:1px solid var(--line);padding:26px 22px;position:sticky;top:0;height:100vh;overflow:auto}
  .brand{font-weight:800;font-size:20px;letter-spacing:-.02em;margin:0 0 4px}
  .brand small{display:block;font-weight:500;color:var(--muted);font-size:13px;letter-spacing:0}
  .search{margin:18px 0 8px}
  .search input{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--bg);font:inherit;color:var(--ink)}
  .search input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
  .f{margin-top:18px}
  .f-name{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
  .f-opts{display:flex;flex-direction:column;gap:2px}
  .f-opts button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;background:none;padding:6px 8px;border-radius:8px;color:var(--muted);cursor:pointer;font:inherit;font-weight:500}
  .f-opts button::before{content:"";width:14px;height:14px;border-radius:50%;border:1.5px solid var(--faint);flex:none}
  .f-opts button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
  .f-opts button[aria-pressed="true"]::before{border:4.5px solid var(--accent)}
  .f-opts button:hover{color:var(--ink)}
  .clear{margin-top:22px;width:100%;border:1px solid var(--line);background:none;border-radius:10px;padding:8px;cursor:pointer;font:inherit;font-weight:600;color:var(--muted)}
  .clear[hidden]{display:none}
  main{padding:30px 34px 70px;min-width:0}
  .head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
  .head h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em}
  .head p{margin:4px 0 0;color:var(--muted)}
  .head p b{color:var(--ink)}
  .sort{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
  .sort button{border:0;background:none;padding:6px 12px;border-radius:7px;cursor:pointer;font:inherit;font-weight:600;color:var(--muted)}
  .sort button[aria-pressed="true"]{background:var(--ink);color:#fff}
  .day{font-size:13px;font-weight:700;color:var(--muted);margin:26px 0 10px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;position:relative}
  .card:hover{border-color:#C9CFDF}
  .row{display:flex;align-items:center;gap:10px}
  .avatar{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;flex:none}
  .who{min-width:0;flex:1}
  .who .co{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .who .loc{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .time{font-size:12px;color:var(--faint);white-space:nowrap}
  .time.fresh{color:var(--green);font-weight:700}
  .card h3{margin:0;font-size:16px;font-weight:700;line-height:1.3;letter-spacing:-.01em}
  .card h3 a{text-decoration:none}
  .card h3 a::after{content:"";position:absolute;inset:0;border-radius:14px}
  .pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
  .pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:#EEF0F5;color:var(--muted)}
  .pill.deg{background:var(--violet-soft);color:var(--violet)}
  .pill.req{background:var(--amber-soft);color:var(--amber)}
  .pill.spon{background:var(--green-soft);color:var(--green)}
  .pill.model{background:var(--sky-soft);color:var(--sky)}
  .foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:10px;font-size:12.5px;color:var(--muted)}
  .foot .score{font-weight:800;color:var(--ink)}
  .empty{padding:60px 20px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:14px}
  .empty button{margin-top:10px;border:1px solid var(--line);background:none;border-radius:10px;padding:7px 14px;cursor:pointer;font:inherit;font-weight:600}
  footer{color:var(--faint);font-size:12.5px;margin-top:40px;max-width:80ch}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media (max-width:820px){
    .layout{grid-template-columns:1fr}
    aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:18px 20px}
    .f-opts{flex-direction:row;flex-wrap:wrap;gap:4px}
    .f-opts button{width:auto;padding:5px 10px;border:1px solid var(--line);border-radius:999px}
    .f-opts button::before{display:none}
    .f-opts button[aria-pressed="true"]{border-color:transparent}
    main{padding:20px}
  }
</style>
</head>
<body>
<div class="layout">
  <aside>
    <p class="brand">Internship radar<small>LinkedIn + Jobright, hourly</small></p>
    <label class="search"><input id="q" type="search" placeholder="Search…" aria-label="Search"></label>
    <div id="controls"></div>
    <button class="clear" id="clear" hidden>Clear all filters</button>
  </aside>
  <main>
    <div class="head">
      <div><h1 id="h">Open internships</h1><p id="lede"></p></div>
      <div class="sort" role="group" aria-label="Sort"><button id="sort-new">Newest</button><button id="sort-score">Best match</button></div>
    </div>
    <div id="list"></div>
    <footer><p id="updated"></p><p>Degree and work-authorization labels are read from each posting with keyword rules; confirm in the posting. Match % is Jobright's score for one profile.</p></footer>
  </main>
</div>
<script src="core.js"></script>
<script>
(() => {
  const B = window.Board, $ = s => document.querySelector(s);
  let jobs = [];
  const ctl = $("#controls"), q = $("#q"), list = $("#list"), clear = $("#clear");
  const palette = ["#3B4FE4","#0F7B4F","#B8541B","#6C3BD1","#0B6E9E","#9A2D6B","#1F6F5A","#7A4B00"];
  const color = s => palette[[...s].reduce((a, c) => a + c.charCodeAt(0), 0) % palette.length];
  const initials = s => s.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase();
  B.readURL(); B.mountControls(ctl, "chips", render);
  q.value = B.state.q; q.addEventListener("input", () => { B.state.q = q.value; render(); });
  clear.addEventListener("click", () => { B.clear(); q.value = ""; render(); });
  $("#sort-new").onclick = () => { B.state.sort = "new"; render(); };
  $("#sort-score").onclick = () => { B.state.sort = "score"; render(); };
  function render(){
    B.syncControls(ctl); B.writeURL(); clear.hidden = B.isDefault();
    $("#sort-new").setAttribute("aria-pressed", String(B.state.sort === "new")); $("#sort-score").setAttribute("aria-pressed", String(B.state.sort === "score"));
    const now = new Date(), shown = B.sort(jobs.filter(j => B.matches(j, now)));
    $("#h").textContent = shown.length === jobs.length ? "Open internships" : `${shown.length} matching internships`;
    if (!shown.length) { list.innerHTML = `<div class="empty">Nothing matches these filters.<br><button id="c2">Clear all filters</button></div>`; $("#c2").onclick = () => clear.click(); return; }
    const sections = B.state.sort === "new" ? [...B.group(shown)] : [[null, shown]];
    let html = "";
    for (const [k, items] of sections) {
      if (k) html += `<div class="day">${B.esc(B.dayLabel(k, now))}</div>`;
      html += `<div class="grid">`;
      for (const j of items) {
        const d = new Date(j.posted_at), fresh = now - d < 3600000;
        html += `<article class="card">
          <div class="row"><div class="avatar" style="background:${color(j.company)}">${B.esc(initials(j.company))}</div>
            <div class="who"><div class="co">${B.esc(j.company)}</div><div class="loc">${B.esc(j.location)}</div></div>
            <div class="time${fresh ? " fresh" : ""}">${B.esc(B.rel(d, now))}</div></div>
          <h3><a href="${B.esc(j.url)}" target="_blank" rel="noopener">${B.esc(j.title)}</a></h3>
          <div class="pills">
            ${j.degrees.length ? `<span class="pill deg">${B.esc(j.degree)}</span>` : ""}
            ${j.work_auth === "Authorization required" ? `<span class="pill req">Authorization required</span>` : j.work_auth === "Sponsorship available" ? `<span class="pill spon">Sponsorship available</span>` : ""}
            ${j.work_model !== "Not specified" ? `<span class="pill model">${B.esc(j.work_model)}</span>` : ""}
          </div>
          <div class="foot"><span>${B.esc(j.source)}</span>${j.score ? `<span class="score">${j.score}% match</span>` : ""}</div>
        </article>`;
      }
      html += `</div>`;
    }
    list.innerHTML = html;
  }
  B.load().then(d => {
    jobs = d.jobs || []; const now = new Date();
    const today = jobs.filter(j => B.dayKey(new Date(j.posted_at)) === B.dayKey(now)).length;
    const hour = jobs.filter(j => now - new Date(j.posted_at) < 3600000).length;
    $("#lede").innerHTML = `<b>${jobs.length}</b> open · <b>${today}</b> posted today${hour ? ` · <b>${hour}</b> in the last hour` : ""}`;
    if (d.generated_at) $("#updated").textContent = `Last checked ${B.rel(new Date(d.generated_at), now)}.`;
    render();
  }).catch(() => { list.innerHTML = `<div class="empty">The job list could not be loaded. Try again in a minute.</div>`; });
})();
</script>
</body>
</html>
